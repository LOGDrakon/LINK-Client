name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/LINK.Core/LINK.Core.csproj
          dotnet restore src/LINK.Transport.Serial/LINK.Transport.Serial.csproj
          dotnet restore src/LINK.Transport.Tcp/LINK.Transport.Tcp.csproj
          dotnet restore src/LINK.Client/LINK.Client.csproj

      - name: Build
        run: |
          dotnet build src/LINK.Core/LINK.Core.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/LINK.Transport.Serial/LINK.Transport.Serial.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/LINK.Transport.Tcp/LINK.Transport.Tcp.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/LINK.Client/LINK.Client.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/LINK.Core/LINK.Core.csproj -c Release --no-build -o nupkgs/ -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack src/LINK.Transport.Serial/LINK.Transport.Serial.csproj -c Release --no-build -o nupkgs/ -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack src/LINK.Transport.Tcp/LINK.Transport.Tcp.csproj -c Release --no-build -o nupkgs/ -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack src/LINK.Client/LINK.Client.csproj -c Release --no-build -o nupkgs/ -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet.org
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/LOGDrakon/index.json --skip-duplicate
